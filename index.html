<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>候位系統</title>

  <style>

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f5f7fa;

      text-align: center;

      padding: 40px 20px;

      color: #222;
    }

    .box {
      max-width: 600px;

      margin: 0 auto;

      background: white;

      padding: 40px 25px;

      border-radius: 20px;

      box-shadow:
        0 4px 20px
        rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
    }

  </style>

</head>

<body>

  <div class="box">

    <h1>候位系統</h1>

    <p>
      網站建立成功！
    </p>

  </div>

</body>

</html>
