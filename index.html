<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>菇凡圓影影必傘菌｜現場候位</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        "Segoe UI",
        Arial,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #f7f9fc 0%,
          #eef2f6 100%
        );

      color: #222;

      line-height: 1.6;

    }


    .container {

      width: 100%;

      max-width: 720px;

      margin: 0 auto;

      padding: 20px 16px 40px;

    }


    /* ================================
       標題
       ================================ */

    .title {

      text-align: center;

      padding: 20px 10px 24px;

    }


    .title h1 {

      margin: 0;

      font-size: 28px;

      font-weight: 800;

      letter-spacing: 1px;

    }


    .title p {

      margin: 6px 0 0;

      color: #777;

      font-size: 15px;

    }


    /* ================================
       目前資訊
       ================================ */

    .current-card {

      background: #ffffff;

      border-radius: 22px;

      padding: 24px 20px;

      box-shadow:
        0 8px 30px
        rgba(0, 0, 0, 0.08);

      margin-bottom: 20px;

    }


    .current-title {

      text-align: center;

      color: #777;

      font-size: 15px;

      margin-bottom: 4px;

    }


    .current-session {

      text-align: center;

      font-size: 32px;

      font-weight: 800;

      margin-bottom: 20px;

    }


    .info-grid {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 12px;

    }


    .info-item {

      background: #f5f7fa;

      border-radius: 14px;

      padding: 14px;

      text-align: center;

    }


    .info-label {

      color: #777;

      font-size: 14px;

      margin-bottom: 3px;

    }


    .info-value {

      font-size: 20px;

      font-weight: 800;

    }


    /* ================================
       候補名額
       ================================ */

    .waiting-box {

      margin-top: 14px;

      background: #fff7e6;

      border-radius: 14px;

      padding: 15px;

      text-align: center;

      border: 1px solid #ffe2a8;

    }


    .waiting-label {

      font-size: 14px;

      color: #8a6418;

    }


    .waiting-count {

      font-size: 30px;

      font-weight: 800;

      color: #c77b00;

    }


    /* ================================
       狀態
       ================================ */

    .status {

      margin-top: 14px;

      border-radius: 14px;

      padding: 13px;

      text-align: center;

      font-size: 20px;

      font-weight: 800;

    }


    .status.open {

      background: #e8f7ed;

      color: #176b36;

    }


    .status.closed {

      background: #fdecec;

      color: #a11;

    }


    .status.unknown {

      background: #f0f0f0;

      color: #666;

    }


    /* ================================
       場次
       ================================ */

    .section {

      background: #ffffff;

      border-radius: 20px;

      padding: 20px;

      box-shadow:
        0 5px 20px
        rgba(0, 0, 0, 0.05);

      margin-bottom: 20px;

    }


    .section-title {

      font-size: 20px;

      font-weight: 800;

      margin-bottom: 14px;

    }


    .session-list {

      display: flex;

      flex-direction: column;

      gap: 10px;

    }


    .session-item {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

      padding: 13px 14px;

      border-radius: 12px;

      background: #f6f7f9;

    }


    .session-item.current {

      background: #eaf2ff;

      border: 2px solid #1677ff;

    }


    .session-name {

      font-weight: 800;

    }


    .session-detail {

      text-align: right;

      color: #666;

      font-size: 14px;

    }


    /* ================================
       注意事項
       ================================ */

    .notice {

      text-align: center;

      padding: 18px 10px;

      color: #555;

      font-size: 15px;

    }


    .notice strong {

      display: block;

      margin-top: 5px;

    }


    /* ================================
       更新時間
       ================================ */

    .updated {

      text-align: center;

      color: #999;

      font-size: 12px;

      margin-top: 20px;

    }


    /* ================================
       載入
       ================================ */

    .loading {

      text-align: center;

      color: #777;

      padding: 30px 10px;

    }


    .error {

      background: #fdecec;

      color: #a11;

      border-radius: 12px;

      padding: 15px;

      text-align: center;

      margin-top: 15px;

    }


    /* ================================
       手機
       ================================ */

    @media (max-width: 480px) {

      .container {

        padding:
          12px
          12px
          30px;

      }


      .title h1 {

        font-size: 24px;

      }


      .current-session {

        font-size: 28px;

      }


      .info-grid {

        grid-template-columns:
          1fr;

      }


      .session-item {

        flex-direction: column;

        align-items: flex-start;

      }


      .session-detail {

        text-align: left;

      }

    }

  </style>

</head>


<body>


  <main class="container">


    <!-- ==========================
         網站標題
         ========================== -->

    <header class="title">

      <h1>
        菇凡圓影影必傘菌
      </h1>

      <p>
        現場候位報到資訊
      </p>

    </header>


    <!-- ==========================
         目前資訊
         ========================== -->

    <section class="current-card">

      <div class="current-title">
        目前場次
      </div>


      <div
        id="currentSession"
        class="current-session">

        載入中...

      </div>


      <div class="info-grid">


        <div class="info-item">

          <div class="info-label">
            候位範圍
          </div>

          <div
            id="currentRange"
            class="info-value">

            -

          </div>

        </div>


        <div class="info-item">

          <div class="info-label">
            報到時間
          </div>

          <div
            id="currentTime"
            class="info-value">

            -

          </div>

        </div>


      </div>


      <div class="waiting-box">

        <div class="waiting-label">
          候補名額
        </div>

        <div
          id="waitingCount"
          class="waiting-count">

          -

        </div>

      </div>


      <div
        id="status"
        class="status unknown">

        資料載入中...

      </div>


    </section>


    <!-- ==========================
         場次資訊
         ========================== -->

    <section class="section">

      <div class="section-title">

        現場候位者 報到時間

      </div>


      <div
        id="sessionList"
        class="session-list">

        <div class="loading">
          載入場次資料中...
        </div>

      </div>

    </section>


    <!-- ==========================
         注意事項
         ========================== -->

    <section class="notice">

      <strong>
        #臨櫃報到
      </strong>

      <strong>
        #逾時視同棄權，建議提早到場
      </strong>

    </section>


    <div
      id="lastUpdated"
      class="updated">

    </div>


    <div
      id="error"
      class="error"
      style="display:none;">

    </div>


  </main>


  <script>


    /*
     * ==========================================
     * Google Apps Script API
     *
     * 把 AAAA 換成你的 Apps Script 網址
     * ==========================================
     */

    const API_URL = 'https://script.google.com/macros/s/AKfycbyWTs8NQEbeL9IMsCmGZ58VneIdGqd01PKMvAEbVrKySudXaqA2OUUuadczZ-46Cdg/exec';


    /*
     * ==========================================
     * 更新間隔
     *
     * 10 秒
     * ==========================================
     */

    const REFRESH_INTERVAL =
      10000;


    /*
     * ==========================================
     * 取得資料
     * ==========================================
     */

    function loadData() {


      fetch(API_URL, {

        method: 'GET',

        cache: 'no-store'

      })


      .then(function(response) {


        if (!response.ok) {

          throw new Error(
            '伺服器回應錯誤'
          );

        }


        return response.json();

      })


      .then(function(data) {

        displayData(data);

        hideError();

      })


      .catch(function(error) {

        console.error(error);

        showError(
          '目前無法取得最新資料，請稍後再試。'
        );

      });

    }


    /*
     * ==========================================
     * 顯示資料
     * ==========================================
     */

    function displayData(data) {


      /*
       * 目前場次
       */

      document
        .getElementById(
          'currentSession'
        )
        .textContent =
        data.currentSession ||
        '-';


      /*
       * 候位範圍
       */

      document
        .getElementById(
          'currentRange'
        )
        .textContent =
        data.currentRange ||
        '-';


      /*
       * 報到時間
       */

      document
        .getElementById(
          'currentTime'
        )
        .textContent =
        data.currentTime ||
        '-';


      /*
       * 候補名額
       */

      document
        .getElementById(
          'waitingCount'
        )
        .textContent =
        Number(
          data.waitingCount || 0
        );


      /*
       * 狀態
       */

      const statusElement =
        document.getElementById(
          'status'
        );


      statusElement.textContent =
        data.status ||
        '-';


      statusElement.className =
        'status';


      if (
        data.status ===
        '開放報到'
      ) {

        statusElement.classList.add(
          'open'
        );

      }

      else if (
        data.status ===
        '候補結束'
      ) {

        statusElement.classList.add(
          'closed'
        );

      }

      else {

        statusElement.classList.add(
          'unknown'
        );

      }


      /*
       * 場次列表
       */

      renderSessions(
        data.sessions || [],
        data.currentSession
      );


      /*
       * 最後更新時間
       */

      const updatedElement =
        document.getElementById(
          'lastUpdated'
        );


      if (data.lastUpdated) {

        updatedElement.textContent =
          '最後更新：' +
          data.lastUpdated;

      }

    }


    /*
     * ==========================================
     * 顯示六個場次
     * ==========================================
     */

    function renderSessions(
      sessions,
      currentSession
    ) {


      const list =
        document.getElementById(
          'sessionList'
        );


      list.innerHTML = '';


      if (
        !sessions ||
        sessions.length === 0
      ) {

        list.innerHTML =
          '<div class="loading">' +
          '目前沒有場次資料' +
          '</div>';

        return;

      }


      sessions.forEach(
        function(session) {


          const item =
            document.createElement(
              'div'
            );


          item.className =
            'session-item';


          /*
           * 如果是目前場次
           * 特別標示
           */

          if (
            session.name ===
            currentSession
          ) {

            item.classList.add(
              'current'
            );

          }


          item.innerHTML =

            '<div>' +

              '<div class="session-name">' +

                escapeHtml(
                  session.name
                ) +

              '</div>' +

            '</div>' +


            '<div class="session-detail">' +

              escapeHtml(
                session.time
              ) +

              '<br>' +

              escapeHtml(
                session.range
              ) +

            '</div>';


          list.appendChild(
            item
          );

        }
      );

    }


    /*
     * ==========================================
     * HTML 安全處理
     * ==========================================
     */

    function escapeHtml(text) {


      const div =
        document.createElement(
          'div'
        );


      div.textContent =
        text || '';


      return div.innerHTML;

    }


    /*
     * ==========================================
     * 錯誤提示
     * ==========================================
     */

    function showError(message) {

      const element =
        document.getElementById(
          'error'
        );


      element.textContent =
        message;


      element.style.display =
        'block';

    }


    function hideError() {

      const element =
        document.getElementById(
          'error'
        );


      element.style.display =
        'none';

    }


    /*
     * ==========================================
     * 第一次載入
     * ==========================================
     */

    loadData();


    /*
     * ==========================================
     * 每 10 秒自動更新
     * ==========================================
     */

    setInterval(
      loadData,
      REFRESH_INTERVAL
    );


  </script>


</body>

</html>
